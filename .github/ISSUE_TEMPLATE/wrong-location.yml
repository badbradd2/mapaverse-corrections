name: Wrong location
description: A home, a trip or an event is on the wrong world.
title: "Wrong location: "
labels: ["correction", "location"]
body:
  - type: input
    id: page
    attributes:
      label: Which page
      description: The mapaverse.com address where the mistake appears.
      placeholder: https://mapaverse.com/marvel/character/thor
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: What the page or map shows now, for example "Puts Nebula's home on Titan in 2014".
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Where it should be
      description: The world and, if it matters, the years.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: The source
      description: A fan-wiki page, a comic issue (title, volume, number) or a film or episode with a rough timestamp. Corrections without a source cannot be checked.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources the page cites now
      description: Filled in automatically when you come from the site. Leave as is.
    validations:
      required: false
