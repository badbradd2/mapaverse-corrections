name: Missing character
description: Someone who belongs on the map is not there.
title: "Missing character: "
labels: ["correction", "missing"]
body:
  - type: input
    id: character
    attributes:
      label: Character
      description: The name, and the continuity (films, comics or Fox X-Men films).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why they belong
      description: The worlds they visit or the events they are part of that the map already shows.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Related page
      description: A mapaverse.com page they should appear on, if any.
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: The source
      description: A fan-wiki page, a comic issue (title, volume, number) or a film or episode with a rough timestamp. Corrections without a source cannot be checked.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources the page cites now
      description: Filled in automatically when you come from the site. Leave as is.
    validations:
      required: false
